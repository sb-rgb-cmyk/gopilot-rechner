name: Publish calculator site

on:
  push:
    branches: [main]
    paths: [calculator-core.js, calculator.css, calculator.js, icons.js, index.html]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Collect site files
        run: |
          mkdir "$RUNNER_TEMP/site"
          cp -- calculator-core.js calculator.css calculator.js icons.js index.html "$RUNNER_TEMP/site/"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site
      - uses: actions/deploy-pages@v4
        id: deployment
